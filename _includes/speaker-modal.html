<dialog id="speaker-modal">
  <button
    type="button"
    id="speaker-modal-close"
    aria-label="Close">
    ×
  </button>

  <h2 id="speaker-modal-name"></h2>

  <p id="speaker-modal-bio"></p>

  <p id="speaker-modal-link-wrapper" style="display:none;">
    🔗
    <a
      id="speaker-modal-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      Website
    </a>
  </p>
</dialog>

<script id="speaker-data" type="application/json">
  {{ site.data.speakers | jsonify }}
</script>
