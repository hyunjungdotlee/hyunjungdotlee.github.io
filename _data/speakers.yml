sayaka-osanami-torngren:
  name: Sayaka Osanami Törngren
  bio: > I am an Associate Professor in International Migration and Ethnic Relations (IMER), with particular expertise in race and racialisation, racism and discrimination, and social inequality. My research interests include race and racialization, racism and discrimination, and inequality.

nadine-nakamura:
  name: Nadine Nakamura
  bio: > Nadine Nakamura is a Professor and Associate Director of Clinical Training at Alliant University’s California School of Professional Psychology in San Diego, CA. She earned a BA in Psychology with a specialization in Asian American Studies from UCLA and a PhD in Clinical Psychology from The George Washington University. Her research focuses on the experiences of LGBTQ people of color and LGBTQ immigrants. She co-edited the book LGBTQ Mental Health: International Perspectives and Experiences and is a co-author on the forthcoming book Foundations of Asian American Psychology: A Feminist, Anti-Racist Approach. She is an APA representative to the International Psychology Network for Lesbian, Gay, Bisexual, Transgender, and Intersex Issues and serves. She is a fellow of the American Psychological Association and a licensed psychologist.


leyao-rovira:
  name: Leyao Rovira
  bio: > Anti-racist activist, speaker, and content creator for NO ME LLAMES CHINITA on anti-Asian racism and non-colonial transracial adoption since 2021. Adopted in 2002 in Hunan by a family from Tarragona, Catalonia. She is a student of Sociocultural and Gender Studies right now. In July 2025, she published FORMAS DE RACISMO ANTIASIÁTICO (Forms of Anti-Asian Racism), a recording of a discussion with six activists of Asian origin talking about anti-Asian racism. She has participated in conferences, educational guides, and events on adoption and racism in Spain. Leyao collaborated with Píkara magazine, with articles like: "We Are Not Exotic Dishes or À La Carte Experiences," "What's Romantic About Adoption?" and "I Am a Child of the One-Child Policy." She recently wrote "Adoption in the Words of Your China Doll" for the magazine LA SOCIOCULTURAL. Finally, she was nominated for Best New Media Creation at the 2025 ODA Awards (Observatory of Diversity in Audiovisual Media).

richard-lee:
  name: Richard Lee
  bio: >  I am a US-born Korean American, raised by immigrant parents from S Korea. I am currently a Professor of Psychology and Asian American Studies at the University of Minnesota. I am broadly interested in the ways race, ethnicity, and culture shape the lived experiences of Asian American youth and families, including identity development, acculturation/enculturation, ethnic-racial socialization, stereotypes and discrimination, and diaspora experiences. My research involves quantitative, qualitative, and mixed-method approaches using surveys and interviews in cross-sectional and longitudinal study designs. Given the unique life experiences of different Asian diaspora groups, I have a particular interest in the conceptualization and development of self-report measures to capture these lived experiences. I also have a longstanding interest in the transracial and transnational experiences of Korean adoptees from childhood into adulthood.
