ye-charlotte-ming:
  name: Ye Charlotte Ming
  bio: >
    I am a journalist, writer, and artist based in Berlin. Raised in China and trained as a journalist in the U.S., I now research Germany's colonial history in China, with a particular focus on my hometown of Qingdao.

My work is interdisciplinary and cross-media. I've written about culture, history, and migration for publications such as National Geographic, TIME, South China Morning Post and collaborated with cultural and educational institutions to develop walking tours, exhibitions, audio and film. My interest: postcolonialism, migration, global Asian diasporic experiences, and the construction of history, memory, and narrative. Foodways. The heavy stuff and the fun stuff.

zhilin-wu:
  name: Zhilin Wu
  bio: >
    My name is Zhilin Wu, and I am based in the Netherlands. I am a PhD student at the University of Groningen, and my research focuses on Dutch-Asian film communities. Apart from my academic life, I am a research member at Asian Voices Europe and work for the Berlin NewGen film festival.

