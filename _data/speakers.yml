sayaka-osanami-torngren:
  name: "Sayaka Osanami Törngren"
  bio: >
    I am an Associate Professor in International Migration and Ethnic Relations (IMER), with particular expertise in race and racialisation, racism and discrimination, and social inequality. My research interests include race and racialization, racism and discrimination, and inequality.

  website: "https://mau.se/en/persons/sayaka.torngren/"
  
nadine-nakamura:
  name: "Nadine Nakamura"
  bio: >
    Nadine Nakamura is a Professor and Associate Director of Clinical Training at Alliant University’s California School of Professional Psychology in San Diego, CA. She earned a BA in Psychology with a specialization in Asian American Studies from UCLA and a PhD in Clinical Psychology from The George Washington University. Her research focuses on the experiences of LGBTQ people of color and LGBTQ immigrants. She co-edited the book LGBTQ Mental Health: International Perspectives and Experiences and is a co-author on the forthcoming book Foundations of Asian American Psychology: A Feminist, Anti-Racist Approach. She is an APA representative to the International Psychology Network for Lesbian, Gay, Bisexual, Transgender, and Intersex Issues and serves. She is a fellow of the American Psychological Association and a licensed psychologist.
  
  website: "https://drnadinenakamura.com/m"

leyao-rovira:
  name: "Leyao Rovira"
  bio: >
    Anti-racist activist, speaker, and content creator for NO ME LLAMES CHINITA on anti-Asian racism and non-colonial transracial adoption since 2021. Adopted in 2002 in Hunan by a family from Tarragona, Catalonia. She is a student of Sociocultural and Gender Studies right now. In July 2025, she published FORMAS DE RACISMO ANTIASIÁTICO (Forms of Anti-Asian Racism), a recording of a discussion with six activists of Asian origin talking about anti-Asian racism. She has participated in conferences, educational guides, and events on adoption and racism in Spain. Leyao collaborated with Píkara magazine, with articles like: "We Are Not Exotic Dishes or À La Carte Experiences," "What's Romantic About Adoption?" and "I Am a Child of the One-Child Policy." She recently wrote "Adoption in the Words of Your China Doll" for the magazine LA SOCIOCULTURAL. Finally, she was nominated for Best New Media Creation at the 2025 ODA Awards (Observatory of Diversity in Audiovisual Media).
  
  website: "https://www.instagram.com/nomellameschinita"
  
richard-lee:
  name: "Richard Lee"
  bio: >
    I am a US-born Korean American, raised by immigrant parents from S Korea. I am currently a Professor of Psychology and Asian American Studies at the University of Minnesota. I am broadly interested in the ways race, ethnicity, and culture shape the lived experiences of Asian American youth and families, including identity development, acculturation/enculturation, ethnic-racial socialization, stereotypes and discrimination, and diaspora experiences. My research involves quantitative, qualitative, and mixed-method approaches using surveys and interviews in cross-sectional and longitudinal study designs. Given the unique life experiences of different Asian diaspora groups, I have a particular interest in the conceptualization and development of self-report measures to capture these lived experiences. I also have a longstanding interest in the transracial and transnational experiences of Korean adoptees from childhood into adulthood.

  website: "https://famileelab.psych.umn.edu/"

ing-lee:
  name: "Ing Lee"
  bio: >
    Ing Lee is a Korean-Brazilian, hard-of-hearing (deaf) comics artist and illustrator born in Belo Horizonte and currently based in São Paulo. She holds a Bachelor’s degree in Arts from UFMG and has worked for over 8 years as a freelance illustrator and cartoonist.
    Her work explores themes of diaspora, memory, identity, technology, and nostalgia through experimental visual storytelling. This year, she received the Voices Awards in the Comics & Cartoons category for The Demons in AI’s Data, an interactive webcomic about algorithmic bias and AI created with Australian science journalist Carl Smith.
    She was also selected as one of the Brazilian Young Talents of the Book Industry by Frankfurter Buchmesse and PublishNews Brazil, becoming the first creative professional to receive the recognition. Ing also teaches courses and mentors emerging artists, and is a member of Imin – Korean Migration Studies Group, where she independently researches the Korean diaspora and migration in Brazil.

simeng-wang:
  name: "Simeng Wang"
  bio: >
    Simeng Wang is a Permanent Research Fellow at The French National Centre for Scientific Research (CNRS) and holds a PhD in Sociology from the École Normale Supérieure in Paris (2014). Since 2009, she has been working on Chinese immigration in France. Her current work is built around two poles, the first at the intersection of Asian migration and health in a global era; the second on the experiences of racism and discrimination among Asian origin people in France. She is the author of several books and scientific articles on East and Southeast Asian migration - particularly Chinese migration - to France and Europe, health and mental health, and racism and racial discrimination. She is the coordinator of the research network on East and South-East Asian Migrations in France (MAF) and has served as scientific curator of the "East and South-East Asian Immigrations to France since 1860" exhibition held at the French National Museum of the History of Immigration (MNHI, 2023-2024).
  
  website: "https://www.cermes3.cnrs.fr/en/members/statutory-members/simeng-wang.html"

linda-juang:
  name: "Linda Juang"
  bio: >
    I have a background in Developmental Psychology (from the US) and currently am a Professor of Inclusive Education at Uni Potsdam since 2014. My research focuses on minoritized youth and issues of identity, discrimination, and how schools and families socialize their children to understand growing up in racialized, diverse societies.
  website: "https://www.uni-potsdam.de/en/inklusion/diversityemphasis/juang"
  
olivia-hyunsin-kim:
  name: "Olivia Hyunsin Kim"
  bio: >
    Olivia Hyunsin Kim is a choreographer/director, and curator whose work spans opera, performance, and installation. In 2019, they received first prize at the Amadeu Antonio Art Award and graduated with distinction from the MA program in Choreography and Performance at the Institute for Applied Theatre Studies in Giessen. Kim holds a BA in German Studies from Seoul National University and studied dance at the University of Hawai‘i at Mānoa and Falmouth University. They have been artist-in-residence at ImPulsTanz, Goethe-Institut Montréal/Circuit-Est centre chorégraphique, the Tarabya Cultural Academy in Istanbul, and Goethe-Institut Salvador. In 2022/23, Kim was Composer-in-Residence at the Hanover State Opera. Their works have been presented internationally, including at Sophiensæle Berlin, tanzhaus nrw Düsseldorf, Stuttgart State Opera, Art Sonje Center Seoul, and Museo Universitario del Chopo in Mexico City. As the group ddanddarakim, they create queer-feminist and postcolonial work.

  website: "www.ddanddarakim.net"

popo-fan:
  name: "Popo Fan"
  bio: >
    As a filmmaker, Popo Fan has made a notable impact on Chinese society through his queer activism documentary films since 2009. In 2017, he relocated from Beijing to Berlin, where he shifted his focus to fiction. His work delves into intersectional themes such as migration, gender, and sex, often incorporating genre elements like comedy and thriller. Popo works for feminist erotic company Erika Lust as a guest director. After releasing several short films in Germany, Popo is currently developing his debut narrative feature. He was selected for Berlinale Talents in 2017 and served on the jury for the Teddy Award at the Berlinale in 2019. In 2023, he received the PorYes Feminist Porn Award in Berlin. Popo remains active in queer advocacy in China, where he continues to serve as a trainer for the Queer University Video Camp and has helped organize the Beijing Queer Film Festival for nearly two decades.

  website: "http://onlyfanpopo.com/"
  
feng-mei-heberer:
  name: "Feng-Mei Heberer"
  bio: >
    Feng-Mei Heberer researches and teaches in film and media studies. Her work explores the connection between moving images, migration, racial and gender economies, with particular focus on Asian diasporas. She also participates in film curation and community arts programming, and has most recently collaborated with Saigon Experimental, Dekoloniale Berlin/korientation e.V., and the Taiwan Women’s Film Association.

aya-ezawa:
  name: "Aya Ezawa"
  bio: >
    Aya Ezawa is University Lecturer at the Leiden University Institute for Area Studies. A sociologist by training, she is teaching on race and inequalities in Asia, and has among others, conducted research on academics of color in the Netherlands.

  website: "https://www.universiteitleiden.nl/en/staffmembers/aya-ezawa#tab-1"
  
pei-li:
  name: "Pei Li"
  bio: >
    Pei Li co-initiated Queer Squad, a queer feminist community for the Chinese diaspora in Frankfurt am Main. She studied Theater, Film, and Media Studies and is currently working in the Gradiertenkolleg "Configurations of Film" at Uni Frankfurt / Uni Mainz. Her research focuses on independent queer documentary practices and explores how filmmaking / cultural practices within the Chinese diaspora can function as a form of community practice. Alongside her academic work, she is actively engaged in queer/feminist activism and anti-racist initiatives, organizing events on queer diaspora, migration, and anti-racism in transcultural contexts.

  website: "https://www.instagram.com/queersquad_de/"
  
danila-tran-thuy-duong:
  name: "Danila Tran-Thuy-Duong"
  bio: >
    I am a PhD student in the field of Educational Psychology with a special focus on culture and socialization at MLU Halle. My research is about how adolescents and young adults develop their cultural identity amid family and school socialization processes. My main work is on a teacher-implemented intervention project, called the Identity Project, where I conducted an anti-racism training for teachers. However, to contribute to Asian German resilience and visibility in social sciences, I also do research with Vietnamese-German youth who share their life story with a special focus on how they navigate between the family and school contexts. This approach aims to highlight the individual narratives on identity formation, counter narratives and resilience. Besides my research, I'm a passionate foodie, grateful traveller, art and crafts hobbyist, romcom enthusiast and cat mom.

  website: "https://paedagogik.uni-halle.de/arbeitsbereich/psycho_kultur/3160342_3417905/3417905_3478391/"
  
veronica-reyes:
  name: "Veronica B. Reyes"
  bio: >
    Veronica B. Reyes recently graduated in Sociology and Labour Sciences, with a specialization in Gender and Inequalities. Her master’s theses focus on the self-identification of people of Asian descent with whiteness (2023) and on the manifestations of double sight among people of Asian descent (2025). Her research interests include anti-Asian racism, Critical Race Theory (CRT), as well as postcolonial and decolonial theories.

iris-rajanayagam:
  name: "Iris Rajanayagam"
  bio: >
    Iris Rajanayagam is a historian who works on cultures of remembrance, post- and decolonial theories, and intersectionality. She is programme officer for diversity, intersectionality, and decoloniality at the Federal Agency for Civic Education (bpb). Previously, she was the director of the Berlin-based organisation xart splitta, where, amongst other things, she initiated and co-developed the online platform The Living Archives. Between 2017 and 2019, she worked as a research associate in the research project “Passport Control – Living without Papers in Past and Present” at the ASH and contributed to the development of the website "Verwobene Geschichte*n" (Entangled Hi*Stories). Iris Rajanayagam is editor of the anthologies "Geteilte Geschichte_n – Plurale Solidaritäten" (Shared and Divided Hi_Stories – Plural Solidarities) (2024) and "Transformative Archive" (Transformative Archives) (2025), published in the Schriftenreihe of the Federal Agency for Civic Education (bpb).

  website: "https://www.linkedin.com/in/iris-rajanayagam-7813171a1"
  
sina-schindler:
  name: "Sina Schindler"
  bio: >
    Sina Schindler works as project coordinator at korientation - an Asian-German non-profit Communityorganization and is part of the memorial initiative for Phan Văn Toàn, a former Vietnamese contract worker who was subjected to a violent racist attack at the Fredersdorf S-Bahn station near Berlin in 1997, of which he died as a result.

  website: "https://www.korientation.de/projekte/gedenkinitiative-phan-van-toan/"


kimiko-suda:
  name: "Kimiko Suda"
  bio: >
    Kimiko Suda has been a guest professor at the Institute of Asian and African Studies at Humboldt-Universität zu Berlin since October 2024. She works with a sociological and transnational historical perspective that focuses on how knowledge/discourse production, social practices and social structures relate to each other. Her research interests include Sinophone and East Asian diasporic perspectives on migration, (post)migrants´ agency and social change, queer-feminist cultural representation and self-organization, (decolonial) public memory cultures, and anti-Asian racism. She has been a member of korientation e.V. since 2011.

  website: "https://www.iaaw.hu-berlin.de/de/ostasien/mitarbeiter-innen/personal/kimiko-suda"


grazia-ting-deng:
  name: "Grazia Ting Deng"
  bio: >
    Dr. Grazia Ting Deng is a Research Scholar in the Department of Anthropology at Brandeis University. She is the author of the book Chinese Espresso: Contested Race and Convivial Space in Contemporary Italy (Princeton University Press, 2024). Previously, she was a Marie Curie Individual Fellow at Ca’ Foscari University of Venice and a Postdoctoral Research Associate at Brown University, after receiving her PhD in anthropology from the Chinese University of Hong Kong. Deng's work sits at the intersection of immigrant Italy and global China, examining migration, race, and global capitalism.

  website: "https://www.graziadeng.com/"

hyunjung-lee:
  name: "Hyunjung Lee"
  bio: >
    Hyunjung Lee is a lead researcher at Asian Voices Europe to counter anti-Asian racism discourse through data-driven policy advocacy. She has been engaged in anti-racist advocacy focusing on intersectional perspectives in Europe and translated community-based research into structural policy recommendations at national and EU levels. On behlaf of Asian Voices Europe, she participates in the Permanent Anti-Racism Civil Society Forum, contributing to consultations on the development and implementation of EU Anti-Racism Action Plan and Strategy. Since 2025, she has also conducted the Germany's national assessment, evaluating the policy framework and implementation of the National Action Plan Against Racism for the Anti-Racism Map project of European Network Against Racism.

  website: "https://hyunjungdotlee.github.io/"

teresa-swartz:
  name: "Teresa Toguchi Swartz"
  bio: >
    Teresa Toguchi Swartz is a Professor in the Department of Sociology and the Asian American Studies Program at the University of Minnesota. Her research centers on families, youth, and intergenerational relations; race, racism, and Asian Americans; and leisure activity, social engagement, and well-being throughout the life course. Teresa served as the Chair for the Social Sciences Section of the Association for Asian American Studies and as the Director of the Asian American Studies Program at the University of Minnesota.

  website: "https://cla.umn.edu/about/directory/profile/tswartz"

tae-jun-kim:
  name: "Tae Jun Kim"
  bio: >
    Tae Jun Kim is a sociologist working at the National Racism Monitor at the DeZIM. His research focuses on theories of racism and racialization, as well as the causes and extent of racist discrimination and stigmatization in Germany. Additionally, his work explores how racism and discrimination can be effectively measured using quantitative methods.

  website: "https://www.dezim-institut.de/mitarbeitende/tae-jun-kim/"

daun-cheong:
  name: "Daun Cheong"
  bio: >
    Rural Sociologist and Political Economist specialising in power dynamics, agri-food systems, and gendered labour within rural Asian contexts.


somi-dubuque:
  name: "Somi Dubuque"
  bio: >
    I am part of the management team at LesMigraS, a counseling center for queer people in Berlin. For many years, I worked self-employed in political education focused on anti-discrimination, with a focus on criticism on antisemitism and racism and empowment for queer people who have experienced racism. I have also worked in the independent theater scene in Berlin as a performer and assistant director, I write poetry and DJ when I feel like it. I have experience as an activist and get involved in decolonial projects here and there.
    My research project at Zentrum für Antisemitismusforschung was about German_Asian_ Self-Representation in Theatre and Performance.


sun-ju-choi:
  name: "Sun-Ju Choi"
  bio: >
    Sun-Ju Choi works as a curator and writer. As a board member of “neue deutsche organisationen" and Vielfalt in Film” she advocates for greater diversity and intersectionality.

  website: "https://diversity-kartell.com/"




nataly-han:
  name: "Nataly Jung-Hwa Han"
  bio: >
    Nataly Jung-Hwa Han is an activist, researcher, editor, and cultural organizer whose work focuses on gender, postcolonialism, migration, and the history and memory of the “comfort women.” She serves as Chair of the Korea Verband e.V. and has played a central role in its “Comfort Women” Action Group. From 2015 onward, Han continued developing public awareness and educational initiatives concerning survivors of the Japanese military’s wartime system of sexual slavery. Until 2017, the action group invited former “comfort women” to Germany, giving survivors opportunities to share their experiences directly with German audiences. Through 2016, Han also collaborated with Japanese photographer Yajima Tsukasa on a multimedia event series about the issue, presented in more than 30 German cities. Her work extends beyond public activism to publishing, scholarship, and translation. She serves as managing editor of the journal Korea Forum and has contributed to projects addressing Korean migration, postcolonial perspectives, and cultural memory. Since 2019, Han has worked to establish the Museum of Comfort Women (MuT). A major milestone came on September 28, 2020, when she and the action group completed the museum and installed the Statue of Peace, bringing together her long-term work in education, remembrance, and advocacy.
 
  website: "https://koreaverband.de/en/ag-comfort-women/"

ongoo-buyanjargal:
  name: "Ongoo Buyanjargal"
  bio: >
    tbc

romin-khan:
  name: "Romin Khan"
  bio: >
    Romin Khan is a union representative from Berlin. He is responsible for migration policies at ver.di, United Services Union, Germanys second largest union. Romin studied sociology, political studies and history at Humboldt-University Berlin and University of the Western Cape/Cape Town and graduated in 2007. He wrote his master thesis on social movements in South Africa challenging the state party and former liberation movement African National Congress by using Antonio Gramscis concept of hegemony theory. In 2010 he co-authored an anthology on social and urban movements in South Africa. Romin has been active in social movements and antifascist organisations in Germany since the early nineties and is working strongly to shape his union towards an inclusive and antiracist organisation.

ye-charlotte-ming:
  name: "Ye Charlotte Ming"
  bio: >
    I am a journalist, writer, and artist based in Berlin. Raised in China and trained as a journalist in the U.S., I now research Germany's colonial history in China, with a particular focus on my hometown of Qingdao.My work is interdisciplinary and cross-media. I've written about culture, history, and migration for publications such as National Geographic, TIME, South China Morning Post and collaborated with cultural and educational institutions to develop walking tours, exhibitions, audio and film. My interest: postcolonialism, migration, global Asian diasporic experiences, and the construction of history, memory, and narrative. Foodways. The heavy stuff and the fun stuff.

  website: "www.ye-ming.com"

zhilin-wu:
  name: "Zhilin Wu"
  bio: >
    My name is Zhilin Wu, and I am based in the Netherlands. I am a PhD student at the University of Groningen, and my research focuses on Dutch-Asian film communities. Apart from my academic life, I am a research member at Asian Voices Europe and work for the Berlin NewGen film festival.

nguyen-phuong-thuy:
  name: "Phương Thúy Nguyễn"
  bio: >
    In their constant search, words help Thúy pause to see what they find. Outside of her notebook, she motivates other seekers to question the status quo through political education. They love bringing people together and creating connections. In addition to cooking, eating, singing, dancing and playing, this also includes sharing perspectives and telling stories that were never meant to be part of the collective memory. Stories that give us names and hope for healing.
    Nguyễn Phương Thúy (she/ they) grew up in Eastern Germany (former German Democratic Republic- GDR), where their parents had come to as so-called contract workers in 1987. Their home was a large Vietnamese community.
    Thúy is a freelance researcher, educator, community- organizer, curator, writer and film maker. In 2016, they co-founded the Werdau Initiative against Racism (W.I.R.). She is also part of the film and media collective ‘Spill the Ts’. Thúy lives and works in Berlin and East Germany.

  website: "https://www.instagram.com/oi.thuy.oi"

sue-glaeser:
  name: "Sue Glaeser"
  bio: >
    My name is Sue Glaeser and I live in Hamburg, Germany. I am a volunteer board member of korientation e.V., a network for Asian-German perspectives. In Hamburg, our local group creates spaces for connection, exchange and empowerment. Since 2025, I have also been the volunteer project lead of KAD-WAVE, a community-based working group within KAD e.V. KAD-WAVE focuses on community building, critical reflection and collective memory for transnationally adopted people across Germany.

  website: "https://kadev.org/kad-wave/"

mirae-kh-rhee:
  name: "Mirae kh Rhee"
  bio: >
    Mirae kh Rhee (이미래/李未來) is a South Korean-born interdisciplinary artist, writer, and researcher working between Berlin, Seoul, and California. Through textiles, installation, performance, moving image, photography, writing, and social practice, Rhee explores diaspora, family separation, cultural amnesia, and the search for belonging. Combining personal testimony with archival and historical research, the work examines how migration, displacement, and transnational histories continue to shape lives across generations. Recent projects draw on Korean sambe (hemp mourning cloth) and mourning rituals to investigate loss, colonial afterlives, and return. In addition to exhibiting internationally, Rhee publishes essays and creative nonfiction on transnational adoption, identity, and return, including “Sentimental Kinships” (2026), “Born Again Korean” (2025), and “Transkoreaning: Decolonizing Adopted Identity through Artistic Practices and a Return to Home” (2024).
  website: "https://linktr.ee/miraekhrhee"

ann-li:
  name: "Ann Li"
  bio: >
    Ann Li is co-founder of Untold Asian Stories, a platform amplifying Asian perspectives and experiences in Belgium. As an activist, and community builder her work focuses on anti-Asian racism, representation, and belonging, with a strong emphasis on intersectionality. Through initiatives such as Queer Asian Month, she highlights the importance of working across identities and lived experiences, believing that conversations about anti-Asian racism must also make room for queerness, care, and belonging. Drawing from over 12 years of activism, she believes meaningful change happens not only through resistance, but through joy, care, and connection. And that the most sustainable activism is the kind that brings people together.

  website: "https://untoldasianstories.be/"
  
joni-sheila:
  name: "Joni Sheila"
  bio: >
    Joni Sheila is a Filipino-Belgian singer-songwriter from Ghent who built her career on the pavement. A self-taught musician, she was crowned best street performer in Belgium, the Netherlands and Melbourne (Australia). Her resilience earned her a TEDx talk in Vienna and a dedicated feature on Dutch national TV. Yet, accolades didn't erase the barriers: organizers often dismissed street performers as "not real artists," and she endured years of harassment from police and hecklers. Compounding this, she was often the only female and Asian artist in the scene at the time. In 2022, amidst the pandemic and a surge in anti-Asian hate crimes, she recognized the stark lack of representation in media and pivoted. She launched Asian Persuasion, dedicated to building a platform that amplifies Asian voices.  In 2023, Joni renounced busking to dedicate herself to original music Asian Persuasion. Her mission remains the same: connect, create, and amplify unheard voices (her own included).

  website: "https://www.asian-persuasion.com/"
  
christopher-dhave:
  name: "Christopher D’havé"
  bio: >
    Christopher D’havé is a Belgian-Filipino co-founder of Asian Persuasion, a platform dedicated to empowering Asian voices through art and culture. Growing up as part of the diaspora, he navigated the tension between personal dreams and familial expectations, enduring a childhood marked by racism and an intense search for belonging. Despite these challenges, he cultivated a deep passion for music and art. With a background as a DJ, producer, and nightlife curator, Christopher now leverages that experience to tackle the lack of Asian representation in media and the arts. His work is grounded in his past in journalism, where he honed sharp observation skills and a clear voice. He is driven by a fascination with how people find peace in an increasingly chaotic world, exploring what motivates them and how they navigate modern societal challenges.  Christopher’s mission is to help others find their rhythm and create a culture where everyone can truly belong.

  website: "https://www.asian-persuasion.com/"
  
jin-hwa-anna-borstam:
  name: "Jin Hwa Anna Borstam"
  bio: >
    Jin Hwa Anna Borstam is a curator, artist and cultural worker based in Malmö, Sweden. Since 2018, she has worked as curator at Krognoshuset in Lund, where she is the first Asian woman to hold a curatorial position in the institution’s 98-year history. Since 2004, she has been active within the global movement of Korean adoptees, including through UFOlab, an artist collective that contested normative perceptions of racism and transnational adoption from post- and decolonial feminist perspectives. She is also active in SKAN, Swedish Korean Adoptees’ Network. In 2026, she curates Fragments of Adoption at Krognoshuset with Moho House Alternative Space, Sweden’s first intergenerational exhibition on adoption and visual art. Her practice engages with adoption politics, racialization, belonging and memory across art, research, activism and civil society.

  website: "https://www.krognoshuset.se/"

anjannine-kyle-untalan:
  name: "Anjannine Kyle Untalan"
  bio: >
    I am proud to represent the Filipino Women’s Council in Rome. Born and raised in Rome to Filipino parents and now working in Brussels, I have always remained closely connected to our Filipino community. Inspired by the leadership and advocacy of Charito Basa, I have had the privilege of supporting the FWC’s work in promoting the rights and empowerment of Filipino migrant women and their families. I am passionate about Diversity, Equity and Inclusion, and I believe in creating spaces where every woman’s voice is heard, valued, and represented. Through community engagement and advocacy, I continue to contribute to building stronger, more inclusive communities across borders.

shujianing-li:
  name: "Shujianing Li"
  bio: >
    Shujianing Li is a 1.5-generation, queer, Chinese American. She grew up in Shenzhen, China, and Long Island, New York. She holds a Bachelor’s degree from Wesleyan University and a Masters degree in Mental Health Counseling from Boston College. She is currently a doctoral candidate in Counseling Psychology at the University of Minnesota, researching community-based mental health solutions, especially in populations facing barriers to accessing mental healthcare and social services. Shujianing is a community-engaged scholar-practitioner, with a strong interest in community-based participatory research framework and translation of research into practice.

seongmoon-lily-shim:
  name: "Seongmoon Lily Shim"
  bio: >
    Seongmoon Shim (Lily) is currently a researcher and an activist, whose main focuses lie in feminism, decolonization, and (anti-)racism. She has been engaged with various research, community-building and film projects. In 2024 along with the Survey Team at Asian Voices Europe she published the report, [When Asian Voices Echo : Anti-Asian Racism], which analyzed quantitative data of anti-Asian Racism in Europe - mainly in Germany, France, UK and the Netherlands. In 2021 she directed and produced [Our Stories, Our Voices], a short documentary, in which she conducted interviews with Asian women on their personal experiences with sexism and racism in Western Europe. Growing up and living in Europe as an Asian and a woman, racism combined with sexism such as being stereotyped, microaggression, structural discrimination and questioning identity have been big challenges
    of her life.

  website: "https://www.linkedin.com/in/seongmoon-lily-shim-314a53147/" 

hae-lin-choi:
  name: "Hae-Lin Choi"
  bio: >
    When the threat of military intervention and federal incursions into New York City stopped being hypothetical, Hae-Lin Choi helped organize a response. In October 2025, she co-founded HandsOffNYC, a citywide movement that mobilizes New Yorkers to defend their communities through nonviolent resistance and neighborhood solidarity.
    The work is personal for her. Hae-Lin grew up in Germany as the daughter of Korean guestworkers, and she came to organizing through the labor movement, starting with the German service-sector union ver.di in 2001. Over the two decades since, she's built a career in it. As Legislative and Political Director for the Communications Workers of America, District 1 for eight years, she ran legislative, electoral, and organizing campaigns and developed leadership programs across the labor movement.
    She holds a Ph.D. in Political Science from the Free University of Berlin. She lives in Brooklyn with her husband and their two children.

  website: "www.HandsOffNYC.com"
  
jee-un-kim:
  name: "Jee-Un Kim"
  bio: >
    Jee-Un Kim is a founding member of korientation. Network for Asian German Perspectives and its executive director since 2020. This role allowed her to bring together diverse experiences from her legal background, arts and media administration and academia as well as community work. Against the backdrop of the rising right wing forces and an authoritarian turn in the German political landscape, an always lingering question gains a new urgency: What does it really mean and what does it take to pursue community-based, meaningful, and resistant empowerment work that is critical of power structures and racism in practice?

  website: "https://www.korientation.de"

sung-un-gang:
  name: "Sung Un Gang"
  bio: >
    Dr. Sung Un Gang is a research associate on the DFG-funded project "Cultural Memory in Crisis" at TH Köln – University of Applied Sciences. Drawing on postcolonial and intersectional perspectives, he examines how cultural production, social relations, and urban spaces shape one another. He also brings his analyses of sociocultural phenomena to audiences beyond academia: in his podcast "Bin ich süßsauer?" ("Am I sweet-and-sour?"), he interviews queer people of Asian descent in Germany. His writing has appeared on zdf.de and goethe.de, and he has been featured as an expert on Deutschlandfunk Kultur and WDR.

  website: "www.sungungang.com"

panel1:
  name: "[Panel 1] AAR in quantitative research in Europe and the USA"
  bio: >
    This panel examines how quantitative research can make anti-Asian racism more visible while also questions the assumptions built into the production of racial data. Across European, German, and Asian American contexts, the panel addresses the persistent lack of systematic data on anti-Asian racism and shows how this absence can reinforce its social and institutional invisibility. The panel considers who approaches such as QuantCrit can combine quantitative methods with critical perspectives on race. Survey evidence further challenges simplified narrative such as the "model minority" stereotype by showing the diversity of Asian experiences and living conditions. At the same time, the panel critically examines how categories such as "Asian" are defined and how racism is conceptualized and measured. 
    
panel2:
  name: "[Panel 2] Qualitative case studies on AAR and counter-narratives (self-representation)"
  bio: >
    This interdisciplinary panel will discuss the role and importance of qualitative research and community-based work to understanding and addressing anti-Asian racism in Europe. Panelists working in different national contexts and with different diasporic communities will draw on in-depth case studies as well as comparisons across contexts to discuss issues related to invisibility, exclusion, and stereotypes; discourses of race, cultural differences, and colorblindness; identity and community; intersectionality and positionality; and, social action, power, community building and agency.  




panel3:
  name: "[Panel 3] Young scholars’ panel"
  bio: >
    This interdisciplinary panel examines how Asian diasporic groups across Germany, Belgium, and the Netherlands negotiate everyday racialization, identity, and belonging. Spanning family socialization, theater, film curation, everyday encounters with whiteness, and grassroots activism, the presentations jointly explore how Asian diasporans mobilize agency, reclaim narratives, and build community against structural limitations and colonial stereotypes.
    

roundtable1:
  name: "[Roundtable 1] Transnational/Transpacific perspectives on public memory and Asian diasporic archive(s) from Berlin"
  bio: >
    Which strategies and formats can be used to create and sustain public memory around a particular person, social group, or historical topic? How can such practices be connected to collective histories and broader processes of social transformation and struggles for social justice? And what political, institutional, and other obstacles emerge in this work? Taking these questions as a point of departure, this roundtable explores how transnational and transpacific perspectives can pluralize public remembrance through different practices of Asian diasporic individuals and communities working from Berlin. Moving beyond nation-centered narratives, it examines how migration, colonialism, war, racialization, displacement and power dynamics shape the production, documentation, and circulation of memory. Particular attention is given to diasporic archives as dynamic spaces of knowledge, counter-memory, and self-representation, that challenge institutional silences and dominant historical narratives. 



roundtable2:
  name: "[Roundtable 2] Asian diasporic representation in labor politics / trade union organization"
  bio: >
    This roundtable examines the role of Asian diasporic communities in labor politics and trade union organization across German, Italian and the US-American contexts. It asks how Asian workers have been represented within labor movements, how diasporic identities shape experiences of workplace organizing, and how unions have addressed questions of race, migration, gender, and citizenship. Bringing together diverse regional and disciplinary perspectives, the discussion will consider both the exclusions and possibilities of solidarity within labor movements. By foregrounding Asian diasporic voices and organizing practices, the roundtable seeks to rethink the histories and contemporary possibilities of transnational labor politics and collective action. Organizing based on Asian community- AND workplace-based networks might become even more important in the face of upcoming elections, the implementation of anti-migration politics and an increasingly racist public discourse about (post)migrants.

roundtable3:
  name: "[Roundtable 3] Queer-feminist self-representation in culture & arts"
  bio: >
    Intercountry adoption has been called the “silent migration.” Adopted people from South Korea represent the largest segment of this silent and overlooked diaspora population. Growing up transnationally and transracially, Korean adoptees navigate layers of physical and cultural loss, displacement, and ambiguity in the context of self and family, as well as the broader social constructs of race, ethnicity, and nationality. At the same time, they find ways to empower themselves, their families, and their communities and develop meaning and agency in their individual and collective lives. In this roundtable, we will hear from artists and community organizers/activists as they document and validate these forgotten lived experiences. Moving across community-based research, embodied activism, and curatorial practice, this roundtable examines how Korean adoptees create knowledge about origins, family separation, belonging, (anti-)racism, and support needs. The KAD-WAVE pilot survey presents initial findings from internationally adopted people in Germany with focus on access to records, searches for origins, and racialized experiences. Run Toward My Family explores long-distance running as an embodied practice of return, remembrance, and activism across the global geography of Korean adoption. Fragments of Adoption considers exhibition as making a space for dialogue and asks how the legacies of adoption extend beyond adoptees themselves to children and subsequent generations. Together, the panel foregrounds adoptee perspectives while connecting personal experiences to the broader histories of transnational adoption

roundtable4:
  name: "[Roundtable 4] Korean Adoptee Activism"
  bio: >
    Moving across community-based research, embodied activism, and curatorial practice, this roundtable examines how Korean adoptees create knowledge about origins, family separation, belonging, (anti-)racism, and support needs. The KAD-WAVE pilot survey presents initial findings from internationally adopted people in Germany with focus on access to records, searches for origins, and racialized experiences. Run Toward My Family explores long-distance running as an embodied practice of return, remembrance, and activism across the global geography of Korean adoption. Fragments of Adoption considers exhibition as making a space for dialogue and asks how the legacies of adoption extend beyond adoptees themselves to children and subsequent generations. Together, the panel foregrounds adoptee perspectives while connecting personal experiences to the broader histories of transnational adoption.
 
panel4:
  name: "[Panel 4] Asian diasporic perspectives on political institutions and counter-measures to racism"
  bio: >
    This panel examines Asian diasporic perspectives on political institutions, anti-Asian racism, and anti-racist advocacy across Belgium, Germany, Spain and at the EU-context. Panelists discuss how anti-Asian racism remains under-recognized within political agendas, public debate, data collection, and institutional anti-racism frameworks, while increasingly polarized, anti-immigration, and far-right discourses intensify pressures on racialized communities. Drawing on grassroots activism, research and community organizing events, the discussion highlights strategies including data-driven advocacy, coalition building, political education, media and debate training, self-representation, intersectional organizing, and engagement with national and EU institutions. Particular attention is given to the diversity of Asian diasporic experiences and the need to address racism in relation to gender, migration, adoption, queerness, belonging, and other intersecting identities. The panel also considers the sustainability of activism under systemic discrimination, political pressure, and shrinking resources. Beyond resistance, speakers reflect on activism as a source of community, care, critical consciousness, belonging, solidarity, and joy, emphasizing the importance of creating spaces in which Asian diasporic communities can define their own narratives and collectively pursue social and political change

keynote:
  name: "Intersectional Approaches to Addressing Anti-Asian Racism: Moving Towards Racial Justice & Liberation"
  bio: >
    This keynote will address anti-Asian racism with considerations of intersectionality and ways to resist oppression. Anti-Asian racism is not just something that happens on an interpersonal level, but it is something we internalize and must unlearn. Otherwise, we risk turning this oppression against ourselves, others within our communities, and towards other marginalized groups. Intersectionality explicitly recognizes that multiple, interlocking systems of oppression impact our experiences. Using an intersectional lens when considering Asian experiences allows us to understand diverse needs and provides a lens for us to examine the unique struggles of marginalized groups within the larger Asian diasporic community. We will reflect on who is considered the Asian prototype and how this reinforces power and privilege. We will examine ways that authenticity and legitimacy are contested within Asian communities with examples of LGBTQ+ Asians, multiracial Asians, and Asian adoptees. Principles of liberation psychology will be discussed to help us consider ways that we can resist oppression in society at large as well as within our own work.
